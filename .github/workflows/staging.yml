name: Staging CI
run-name: Staging - Node ${{ github.event.inputs.node }} / ${{ github.event.inputs.os }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      node:
        description: 'Node version'
        required: true
        default: '24.x'
      os:
        description: 'Operating System (ubuntu-20.04, ubuntu-latest, windows-latest)'
        required: true
        default: 'ubuntu-latest'
      test-compat:
        description: 'Run npm run test-compat instead of npm test (use for older Node versions, e.g. 16.x/22.x)'
        type: boolean
        required: false
        default: false

jobs:
  test:
    name: Test - Node ${{ github.event.inputs.node }} on ${{ github.event.inputs.os }}
    runs-on: ${{ github.event.inputs.os }}

    steps:
      - name: Git checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ github.event.inputs.node }}

      - run: |
          if [ "${{ github.event.inputs.test-compat }}" = "true" ]; then
            npm install
          else
            npm install --omit=optional
          fi
        shell: bash
      - name: Run tests
        shell: bash
        run: |
          if [ "${{ github.event.inputs.test-compat }}" = "true" ]; then
            npm run test-compat
          else
            npm test
          fi
        env:
          SWITCHER_API_KEY: ${{ secrets.SWITCHER_API_KEY }}